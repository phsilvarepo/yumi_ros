# Ruckig jerk limits for all YuMi joints (rad/s^3).
# Without explicit limits Ruckig defaults to 100 rad/s^3, which causes
# numerical convergence failures (error -100) for the 14-DOF both_arms group.
# 50 rad/s^3 is well above the kinematic minimum (~2 rad/s^3) and avoids
# the numerical ill-conditioning that the 100 rad/s^3 default produces.
ruckig:
  yumi_joint_1_l: {jerk_limit: 50.0}
  yumi_joint_2_l: {jerk_limit: 50.0}
  yumi_joint_7_l: {jerk_limit: 50.0}
  yumi_joint_3_l: {jerk_limit: 50.0}
  yumi_joint_4_l: {jerk_limit: 50.0}
  yumi_joint_5_l: {jerk_limit: 50.0}
  yumi_joint_6_l: {jerk_limit: 50.0}
  yumi_joint_1_r: {jerk_limit: 50.0}
  yumi_joint_2_r: {jerk_limit: 50.0}
  yumi_joint_7_r: {jerk_limit: 50.0}
  yumi_joint_3_r: {jerk_limit: 50.0}
  yumi_joint_4_r: {jerk_limit: 50.0}
  yumi_joint_5_r: {jerk_limit: 50.0}
  yumi_joint_6_r: {jerk_limit: 50.0}
